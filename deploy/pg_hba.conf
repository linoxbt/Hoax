# Who may connect to the Hoax Postgres (docker-compose.yml points the server
# here). Inside the container, over the socket, is trusted: the healthcheck and
# psql. Every network connection, the engines' included, needs TLS, the hoax
# user, the hoax database and the password (SCRAM). Nothing else is accepted.
local    all   all                 trust
hostssl  hoax  hoax  0.0.0.0/0     scram-sha-256
hostssl  hoax  hoax  ::/0          scram-sha-256
