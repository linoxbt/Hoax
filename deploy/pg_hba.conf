# Who may connect to the Hoax Postgres (docker-compose.yml points the server
# here). Inside the container, over the socket, is trusted: the healthcheck and
# psql. Every network connection, the engines' included, needs TLS and the password.
local    all  all                trust
hostssl  all  all  0.0.0.0/0     scram-sha-256
hostssl  all  all  ::/0          scram-sha-256
