# Who may connect to the Hoax Postgres (docker-compose.yml points the server
# here). Inside the container, over the socket, is trusted: the healthcheck and
# psql. Every network connection needs TLS, the hoax database and a password
# (SCRAM): the engines' owner role hoax, or hoax_web, the web app's role that
# can only read and write rows (deploy/vps-setup.sh creates it). Nothing else.
local    all   all                     trust
hostssl  hoax  hoax,hoax_web  0.0.0.0/0  scram-sha-256
hostssl  hoax  hoax,hoax_web  ::/0       scram-sha-256
