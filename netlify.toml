# The Hoax web app (apps/web) on Netlify. The watcher runs on Railway.
[build]
  base = "apps/web"
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "22"
  NEXT_TELEMETRY_DISABLED = "1"

# Runs the Next.js app router (server pages and API routes) as Netlify functions.
[[plugins]]
  package = "@netlify/plugin-nextjs"
