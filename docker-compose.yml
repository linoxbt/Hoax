# Hoax watcher + Postgres on one machine (a VPS). Secrets come from .env
# (deploy/vps-setup.sh writes it). The web app on Netlify connects to this
# Postgres over the public port with the same password, over TLS only (the
# script makes a self-signed certificate in deploy/pg-certs, which the web app
# pins through DATABASE_CA_CERT; deploy/pg_hba.conf refuses plain connections).
services:
  db:
    image: postgres:16
    restart: always
    command: ["postgres", "-c", "ssl=on", "-c", "ssl_cert_file=/certs/server.crt", "-c", "ssl_key_file=/certs/server.key", "-c", "hba_file=/etc/hoax/pg_hba.conf"]
    environment:
      POSTGRES_USER: hoax
      POSTGRES_DB: hoax
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    ports:
      - "${POSTGRES_PUBLIC_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./deploy/pg-certs:/certs:ro
      - ./deploy/pg_hba.conf:/etc/hoax/pg_hba.conf:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hoax -d hoax"]
      interval: 5s
      timeout: 5s
      retries: 20

  # One engine per network, same database, keystore and gas wallet. Each
  # protects only its own network's accounts and beats as watcher-<network>.
  watcher: &watcher
    build: .
    restart: always
    depends_on:
      db:
        condition: service_healthy
    environment: &watcher-env
      NETWORK: hideki
      # TLS because pg_hba.conf requires it; unverified because this hop never
      # leaves the compose network.
      DATABASE_URL: postgres://hoax:${POSTGRES_PASSWORD}@db:5432/hoax?sslmode=no-verify
      HOAX_KEYSTORE_SECRET: ${HOAX_KEYSTORE_SECRET:?set HOAX_KEYSTORE_SECRET in .env}
      KEYSTORE_DIR: /data/keystore
      GAS_WALLET_PRIVATE_KEY: ${GAS_WALLET_PRIVATE_KEY:-}
      HOAX_BUILDER_ADDRESS: ${HOAX_BUILDER_ADDRESS:-}
      HOAX_BUILDER_FEE_BPS_1K: ${HOAX_BUILDER_FEE_BPS_1K:-0}
      DRY_RUN: ${DRY_RUN:-false}
      PORT: "8080"
    ports:
      - "${HEALTH_PORT:-8080}:8080"
    volumes:
      - keystore:/data

  watcher-shannon:
    <<: *watcher
    environment:
      <<: *watcher-env
      NETWORK: shannon
    ports:
      - "${HEALTH_PORT_SHANNON:-8081}:8080"

volumes:
  pgdata:
  keystore:
